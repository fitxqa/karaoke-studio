name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android-app/**", "server/app/web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run web
      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
        env:
          VERSION_CODE: ${{ github.run_number }}
      - run: npx cap sync android
      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../KaraokeStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeStudio-apk
          path: android-app/KaraokeStudio.apk
