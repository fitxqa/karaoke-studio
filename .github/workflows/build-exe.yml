name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  setup-exe:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build KaraokeStudio-Setup.exe
        shell: cmd
        run: build_windows\build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeStudio-Setup
          path: dist/KaraokeStudio-Setup.exe
          compression-level: 0
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v2.0.0
          target_commitish: ${{ github.sha }}
          files: dist/KaraokeStudio-Setup.exe
          name: Karaoke Studio 2.0 (Windows installer)
          body: One-file Windows installer — includes Python and everything needed. Download KaraokeStudio-Setup.exe and double-click.
    permissions:
      contents: write
