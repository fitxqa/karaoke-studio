name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  setup-exe:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build KaraokeStudio-Setup.exe
        shell: cmd
        run: build_windows\build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeStudio-Setup
          path: dist/KaraokeStudio-Setup.exe
          compression-level: 0
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KaraokeStudio-Setup.exe
          name: Karaoke Studio ${{ github.ref_name }} (Windows installer)
          body: One-file Windows installer — includes Python and everything needed. Download KaraokeStudio-Setup.exe and double-click.
    permissions:
      contents: write
