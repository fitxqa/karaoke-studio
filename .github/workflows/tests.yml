name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install fastapi httpx python-multipart librosa soundfile numpy indic_transliteration pytest
      - run: pytest -q tests
